#:schema node_modules/wrangler/config-schema.json
name = "fraith-system"
main = "workers/index.ts"
compatibility_date = "2024-12-01"

# Automatically builds the React + Vite frontend into ./dist whenever `npx wrangler deploy` runs
[build]
command = "npm run build"

# Serves the Vite SPA static assets and routes /api/* (including /api/ws) to the Hono Worker
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

[vars]
CAMPAIGN_ID = "fraith-main-campaign"
JWT_SECRET = "change-me-in-production-via-wrangler-secret-put"
CF_ACCESS_ENABLED = "false"

# Cloudflare D1 SQLite Database
# With wrangler v4, omitting database_id automatically provisions `fraith-dnd-db` on first `npx wrangler deploy`,
# and the Worker auto-initializes tables + seed data on startup.
[[d1_databases]]
binding = "DB"
database_name = "fraith-dnd-db"
migrations_dir = "migrations"

# Cloudflare Durable Object (WebSocket Hibernation API — exported directly from workers/index.ts)
[[durable_objects.bindings]]
name = "CAMPAIGN_DO"
class_name = "CampaignRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CampaignRoom"]

# Вкладка «Доска»: отдельный Durable Object на каждую доску (холст + presence + комментарии).
# Не пересекается с CampaignRoom, поэтому realtime мессенджера/квестов не блокируется.
[[durable_objects.bindings]]
name = "BOARD_ROOM"
class_name = "BoardRoom"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["BoardRoom"]

# Вкладка «Бой»: отдельный Durable Object на каждый бой (инициатива, ход, HP, эффекты, таймер).
[[durable_objects.bindings]]
name = "COMBAT_ROOM"
class_name = "CombatRoom"

[[migrations]]
tag = "v3"
new_sqlite_classes = ["CombatRoom"]

# Optional Cloudflare R2 Object Storage:
# Uncomment after enabling R2 in your Cloudflare Dashboard (or bind `BUCKET` in Worker Settings -> Bindings).
# Until enabled, uploaded quest/bestiary/talent images automatically fall back to D1 storage.
# [[r2_buckets]]
# binding = "BUCKET"
# bucket_name = "fraith-dnd-assets"
