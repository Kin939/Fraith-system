name: Build & Deploy to Cloudflare

permissions:
  contents: write

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Typecheck & Dry-Run Wrangler Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Wrangler bundle & build
        run: npx wrangler deploy --dry-run

  publish-cdn-mirror:
    name: Publish Static JS/CSS Mirror for RU Players (jsDelivr G-Core CDN)
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies & build frontend
        run: |
          npm ci
          npm run build

      - name: Publish dist/ to gh-pages & immutable commit tag
        run: |
          SHORT_SHA="$(git rev-parse --short=12 HEAD)"
          TAG_NAME="cdn-${SHORT_SHA}"
          WORK_DIR="$(mktemp -d)"
          cp -r dist/assets "$WORK_DIR/assets"
          cp dist/cdn-manifest.json "$WORK_DIR/cdn-manifest.json"
          touch "$WORK_DIR/.nojekyll"

          cd "$WORK_DIR"
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore(cdn): publish frontend assets for ${SHORT_SHA}"
          git tag -f "$TAG_NAME"
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push -f origin gh-pages
          git push -f origin "$TAG_NAME"

          curl -fsS "https://purge.jsdelivr.net/gh/${GITHUB_REPOSITORY}@gh-pages/cdn-manifest.json" || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    name: Deploy to Cloudflare Workers + Assets
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check Cloudflare Secrets
        id: check_secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice::Using Cloudflare Dashboard Git Builds (or set CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID for GitHub Actions deploy)."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check_secrets.outputs.configured == 'true'
        run: npm ci

      - name: Deploy Worker, Static Assets, D1 & Durable Object
        if: steps.check_secrets.outputs.configured == 'true'
        run: npx wrangler deploy
