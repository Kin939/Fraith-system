name: Build & Deploy to Cloudflare

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Typecheck & Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck & build Vite bundle
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: pages-dist
          path: dist

  deploy:
    name: Deploy DO, D1 Migrations & Cloudflare Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Check Cloudflare Secrets
        id: check_secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "configured=false" >> $GITHUB_OUTPUT
            echo "::notice::CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID secrets are not set yet. Skipping remote deploy."
          else
            echo "configured=true" >> $GITHUB_OUTPUT
          fi

      - name: Install dependencies
        if: steps.check_secrets.outputs.configured == 'true'
        run: npm ci

      - name: Download built dist
        if: steps.check_secrets.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: pages-dist
          path: dist

      - name: Deploy CampaignRoom Durable Object Worker
        if: steps.check_secrets.outputs.configured == 'true'
        run: npx wrangler deploy -c wrangler.do.toml

      - name: Apply D1 Database Migrations
        if: steps.check_secrets.outputs.configured == 'true'
        run: npx wrangler d1 migrations apply fraith-dnd-db --remote

      - name: Deploy Cloudflare Pages + Hono Functions
        if: steps.check_secrets.outputs.configured == 'true'
        run: npx wrangler pages deploy dist --project-name fraith-system --branch main
