<!doctype html>
<html lang="ru" class="dark" data-theme-user="dm">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d14" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="https://gcore.jsdelivr.net/gh/Kin939/Fraith-system@main/public/favicon.svg"
    />
    <link
      rel="apple-touch-icon"
      href="https://gcore.jsdelivr.net/gh/Kin939/Fraith-system@main/public/apple-touch-icon.png"
    />
    <title>Fraith — Портал кампании D&amp;D 5e</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <style>
      html, body {
        margin: 0;
        min-height: 100vh;
        background-color: #0b0d14;
        color: #eef0f5;
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
      }
      .fraith-boot-wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        box-sizing: border-box;
        background-color: #0b0d14;
      }
      .fraith-boot-card {
        max-width: 24rem;
        width: 100%;
        background: #11141c;
        border: 1px solid rgba(238, 240, 245, 0.08);
        clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
        padding: 1.5rem;
        text-align: left;
      }
      .fraith-boot-title {
        font-weight: 500;
        font-size: 1.125rem;
        letter-spacing: -0.01em;
        color: #eef0f5;
      }
      .fraith-boot-sub {
        margin-top: 0.5rem;
        font-size: 0.8125rem;
        line-height: 1.5;
        color: #a3a9b8;
      }
      .fraith-boot-btn {
        margin-top: 1rem;
        display: none;
        background: #eef0f5;
        color: #0b0d14;
        border: none;
        padding: 0.5rem 1rem;
        font-size: 0.8125rem;
        font-weight: 500;
        cursor: pointer;
      }
    </style>
  </head>
  <body class="bg-bg text-text antialiased selection:bg-primary/25 selection:text-text">
    <div id="root">
      <div class="fraith-boot-wrap">
        <div class="fraith-boot-card">
          <div class="fraith-boot-title">Fraith</div>
          <div id="fraith-boot-status" class="fraith-boot-sub">
            Подключение к столу кампании…
          </div>
          <button
            id="fraith-boot-retry"
            type="button"
            class="fraith-boot-btn"
            onclick="window.location.reload()"
          >
            Обновить страницу
          </button>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
